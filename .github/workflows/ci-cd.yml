name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & Format
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check

  quality:
    name: Typecheck & Test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run type-check
      - run: npm run test:coverage

  security:
    name: CodeQL Security Scan
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

  container-readonly-smoke-test:
    name: Read-only Rootfs Smoke Test
    timeout-minutes: 30
    needs: [lint, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    # Same osa-frontend.container restrictions as production (see osa-deploy):
    # a read-only rootfs can't be exercised by the normal vitest suite, so this
    # is that verification -- it must gate release-image, not just run beside it.
    env:
      RUN_RESTRICTIONS: >-
        --read-only --tmpfs /run:mode=1777 --tmpfs /var/cache/nginx:mode=1777
        --security-opt no-new-privileges --cap-drop=all
        --cap-add=CAP_NET_BIND_SERVICE --user 101:101
      SMOKE_TEST_IMAGE: ghcr.io/kirchenmusik-st-augustin/osa-frontend:${{ github.sha }}-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image (test tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.SMOKE_TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull test image
        run: docker pull "$SMOKE_TEST_IMAGE"

      - name: Run container under production restrictions
        run: |
          # RUN_RESTRICTIONS is a list of options and must be word-split.
          # shellcheck disable=SC2086
          docker run -d --name osa-frontend-smoke $RUN_RESTRICTIONS \
            -p 8080:80 -e API_BASE_URL=/api -e APP_ENVIRONMENT=test \
            "$SMOKE_TEST_IMAGE"

      - name: Poll health endpoint and verify runtime config generation
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ > /dev/null || {
            echo "::error::Container never became healthy under a read-only rootfs"
            docker logs osa-frontend-smoke
            exit 1
          }
          curl -sf http://127.0.0.1:8080/config.js | grep -q API_BASE_URL || {
            echo "::error::config.js was not generated correctly"
            exit 1
          }
          # The unprocessed template must never be servable as-is.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/config.template.js)" = "404"

      - name: Check container logs for read-only rootfs violations
        run: |
          docker logs osa-frontend-smoke > smoke.log 2>&1
          docker stop osa-frontend-smoke
          cat smoke.log
          # "can not modify ... (read-only file system?)" at info level is
          # nginx's own official entrypoint gracefully skipping an
          # unneeded rewrite -- expected and harmless, not a violation.
          if grep -iE "read-only file system|EROFS|permission denied" smoke.log \
              | grep -v "^10-listen-on-ipv6-by-default.sh: info:"; then
            echo "::error::Container hit a read-only rootfs violation"
            exit 1
          fi

  release-image:
    name: Build & Push Image
    timeout-minutes: 30
    needs: [container-readonly-smoke-test, security]
    runs-on: ubuntu-latest
    # Only ever promote what was built from main: workflow_dispatch can be
    # started on any branch, which would otherwise ship unreviewed code as
    # :latest to the auto-updating production host.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kirchenmusik-st-augustin/osa-frontend
      DIGEST: ${{ needs.container-readonly-smoke-test.outputs.digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested image by digest
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.sha }}" \
            "$IMAGE@$DIGEST"
