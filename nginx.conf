server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Served from the writable directory docker-entrypoint.d's
    # 40-generate-runtime-config.sh renders into at container start, not
    # from the (read-only) static asset root -- see that script for why.
    location = /config.js {
        alias /run/frontend-config/config.js;
        add_header Cache-Control "no-store";
    }

    # The unprocessed template must never be served as-is (it still
    # contains literal ${API_BASE_URL}-style placeholders instead of real
    # values).
    location = /config.template.js {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
