repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: podman exec osa-frontend npx eslint --fix
        language: system
        files: \.(js|ts|vue)$
        pass_filenames: true

      - id: prettier
        name: Prettier
        entry: podman exec osa-frontend npx prettier --write --experimental-cli
        language: system
        files: \.(js|ts|vue|json|css|scss)$
        pass_filenames: true

      - id: vue-tsc
        name: Vue TypeScript Strict Type Checking
        entry: podman exec osa-frontend npm run type-check
        language: system
        pass_filenames: false
        always_run: true

      - id: vitest
        name: Vitest & Code Coverage
        entry: podman exec osa-frontend npm run test:coverage
        language: system
        pass_filenames: false
        always_run: true
